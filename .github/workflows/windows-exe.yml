name: Build and test Windows EXE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Windows must pass BEFORE a PR is merged, not only after main turns red.
    paths:
      - 'ads_core/**'
      - 'static/**'
      - 'windows/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'tools/prepare_commercial_build.py'
      - 'tools/release_gate.py'
      - 'tools/package_unsigned_release.py'
      - 'tools/check_customer_bundle.py'
      - 'tools/check_commercial_legal.py'
      - 'windows/vendor-start.ps1'
      - 'windows/package-commercial-release.ps1'
      - 'tools/vendor_ledger.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
    inputs:
      commercial:
        description: 'Build commercial licensing CANDIDATE, unsigned until owner signs EXE'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-exe:
    # PyInstaller stays for pilot/dev builds; the commercial candidate is built with
    # Nuitka (modules compiled to C, much harder to read back or patch than PyInstaller).
    strategy:
      fail-fast: false
      matrix:
        builder: ${{ (github.event_name == 'workflow_dispatch' && inputs.commercial) && fromJSON('["nuitka"]') || fromJSON('["pyinstaller","nuitka"]') }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller pillow pywebview==5.4
          if ('${{ matrix.builder }}' -eq 'nuitka') { python -m pip install "nuitka>=2.6,<3" ordered-set zstandard }
      - name: Run Python tests on Windows
        shell: pwsh
        run: python -m pytest -q
      - name: Check provider wizard JavaScript
        shell: pwsh
        run: |
          node --check static/provider-studio.js
          node --check static/command-palette.js
          node --check static/update-ui.js
          node --check static/connection-guide.js
          node --check static/oauth-finished.js
          node --check static/customer-help.js
          node --check static/openrouter-diagnostics.js
          node --check static/report-date-ranges.js
      - name: Block commercial build when legal terms are draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commercial }}
        shell: pwsh
        run: |
          python tools/check_commercial_legal.py
          if ($LASTEXITCODE -ne 0) { throw 'Legal/privacy publication preflight failed; commercial candidate blocked' }
      - name: Pin vendor public key for manual COMMERCIAL build only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commercial }}
        shell: pwsh
        env:
          LHM_COMMERCIAL_PUBLIC_KEY_B64: ${{ secrets.LHM_COMMERCIAL_PUBLIC_KEY_B64 }}
          # Public half of the Worker's LEASE_SIGNING_KEY. Set => Gmail sign-in build.
          LHM_LEASE_PUBLIC_KEY_B64: ${{ vars.LHM_LEASE_PUBLIC_KEY_B64 }}
        run: |
          python tools/prepare_commercial_build.py --commercial
          if ($LASTEXITCODE -ne 0) { throw 'Commercial key provisioning failed, EXE must not be shipped' }
      - name: Validate signed update worker PowerShell syntax
        shell: pwsh
        run: |
          $source = (python -c "from windows.update_install import _powershell_script; from pathlib import Path; print(_powershell_script(Path('C:/Apps/LHM-Ads-AI.exe'), Path('C:/Updates/LHM-Ads-AI.exe'), 'a'*64, '0.3.2', 12345))") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot render updater script' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'PASS: detached signed-update worker PowerShell syntax'
      - name: Validate commercial backup UI JavaScript
        shell: pwsh
        run: node --check static/commercial.js
      - name: Check PowerShell commercial packaging syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('windows/package-commercial-release.ps1', 'windows/vendor-start.ps1', 'windows/smoke-test.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            Write-Host "PASS: parsed $file"
          }
      - name: Embed signed online update trust (public settings only)
        shell: pwsh
        env:
          LHM_UPDATE_MANIFEST_URL: ${{ vars.LHM_UPDATE_MANIFEST_URL }}
          LHM_UPDATE_PUBLIC_KEY_B64: ${{ vars.LHM_UPDATE_PUBLIC_KEY_B64 }}
        run: python tools/configure_desktop_update.py
      - name: Make branded Windows icon
        shell: pwsh
        run: python windows/make_icon.py
      - name: Cache Nuitka C compilation
        if: ${{ matrix.builder == 'nuitka' }}
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
      - name: Build EXE with Nuitka (onefile, no console)
        if: ${{ matrix.builder == 'nuitka' }}
        shell: pwsh
        run: |
          # tools/* and the seller GUI are seller-only and must never be compiled in.
          python -m nuitka --onefile --windows-console-mode=disable --assume-yes-for-downloads --msvc=latest `
            --output-dir=build-nuitka --output-filename=LHM-Ads-AI.exe `
            --windows-icon-from-ico=windows/lhm-ads-ai.ico `
            --include-data-dir=static=static `
            --include-package=ads_core --include-package=windows --include-package=uvicorn `
            --include-module=windows.desktop_window --include-module=clr `
            --include-package-data=webview --include-package-data=pythonnet --include-package-data=clr_loader `
            --nofollow-import-to=tools --nofollow-import-to=windows.vendor_manager `
            --report=build-nuitka/nuitka-report.xml `
            windows/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-nuitka/LHM-Ads-AI.exe dist/LHM-Ads-AI.exe
          if (-not (Test-Path dist/LHM-Ads-AI.exe)) { throw 'Nuitka EXE not generated' }
      - name: Build EXE with NO console window
        if: ${{ matrix.builder == 'pyinstaller' }}
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LHM-Ads-AI --icon windows/lhm-ads-ai.ico --paths . --add-data "static;static" --collect-submodules uvicorn --collect-submodules ads_core --collect-all cryptography --collect-all webview --collect-all clr_loader --collect-all pythonnet --hidden-import clr --hidden-import windows.desktop_window windows/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/LHM-Ads-AI.exe)) { throw 'EXE not generated' }
      - name: Audit actual packaged customer EXE for vendor-only code
        shell: pwsh
        run: |
          if ('${{ matrix.builder }}' -eq 'nuitka') { python tools/check_customer_bundle.py --nuitka-report build-nuitka/nuitka-report.xml }
          else { python tools/check_customer_bundle.py --exe dist/LHM-Ads-AI.exe }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch actual Windows EXE and check onboarding
        shell: pwsh
        run: ./windows/smoke-test.ps1
      - name: Smoke-test EXE in mandatory Gmail-only mode (staging)
        # Reuse the EXACT built binary with the supported staging flag so CI
        # tests the Google-only security path without embedding fake public
        # keys into a customer-distributable artifact. Real commercial builds
        # already exercise Gmail-only through their pinned release_info.
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.commercial }}
        shell: pwsh
        env:
          LHM_CLOUD_LICENSE_MODE: required
        run: ./windows/smoke-test.ps1
      - name: Validate native WebView2 desktop dependencies
        shell: pwsh
        run: python -c "import webview, clr; print('WebView2 bridge dependencies available')"
      - name: Smoke-test the real native window (WebView2)
        shell: pwsh
        run: |
          $env:LHM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'lhm-ads-native-gui-smoke'
          $proc = Start-Process -FilePath (Join-Path $PWD 'dist\LHM-Ads-AI.exe') -ArgumentList @('--window-smoke','--port','18766') -PassThru
          try {
            if (-not $proc.WaitForExit(60000)) { throw 'Native desktop window did not exit on time' }
            if ($proc.ExitCode -ne 0) { throw "Native window failed, exit code $($proc.ExitCode)" }
            Write-Host 'PASS: standalone Windows WebView2 window starts and closes'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            $log = Join-Path $env:LHM_DATA_DIR 'logs\startup.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
          }
      - name: Emit SHA256 checksum and distribution safety manifest
        if: success()
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/LHM-Ads-AI.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content 'dist/LHM-Ads-AI.sha256' -Value "$hash  LHM-Ads-AI.exe" -Encoding ascii
          Write-Host "LHM Ads AI SHA256: $hash"
          $fingerprint = (python tools/release_gate.py fingerprint-from-source).Trim()
          if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch '^[0-9a-f]{64}$') {
            throw 'Release vendor public key fingerprint invalid'
          }
          $version = (python -c "from ads_core.version import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') {
            throw 'Invalid canonical product semver'
          }
          $edition = 'pilot'
          $licenseMode = 'legacy-pilot'
          $leaseKeyFingerprint = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.commercial }}' -eq 'true') {
            $edition = 'commercial-candidate'
            if ('${{ matrix.builder }}' -ne 'nuitka') { throw 'Commercial candidates must use Nuitka, never PyInstaller' }
            # Public Ed25519 signing key fingerprint from the exact sources compiled.
            $leaseKeyFingerprint = (python -c "import base64,hashlib; from ads_core.release_info import CLOUD_LICENSE_MODE, LEASE_PUBLIC_KEY_B64; assert CLOUD_LICENSE_MODE == 'required'; raw=base64.b64decode(LEASE_PUBLIC_KEY_B64,validate=True); assert len(raw)==32; print(hashlib.sha256(raw).hexdigest())").Trim()
            if ($LASTEXITCODE -ne 0 -or $leaseKeyFingerprint -notmatch '^[0-9a-f]{64}$') {
              throw 'Commercial EXE missing validated Gmail-only Ed25519 lease trust anchor'
            }
            $licenseMode = 'google-only'
          }
          $manifest = @{
            product = 'LHM Ads AI'
            source_commit = '${{ github.sha }}'
            edition = $edition
            product_version = $version
            license_public_key_sha256 = $fingerprint
            executable = 'LHM-Ads-AI.exe'
            sha256 = $hash
            created_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            builder = '${{ matrix.builder }}'
            license_mode = $licenseMode
            lease_public_key_sha256 = $leaseKeyFingerprint
            authenticode = 'UNSIGNED'
            distribution = 'NOT_APPROVED_FOR_SALE'
          }
          $manifest | ConvertTo-Json | Set-Content -Path 'dist/release-manifest.json' -Encoding utf8
          $instructions = @(
            'LHM Ads AI - INTERNAL CI CANDIDATE ONLY.'
            'Windows Authenticode is UNSIGNED. SmartScreen/Unknown Publisher warnings may occur.'
            'Never disable Windows protections to bypass those warnings.'
          )
          if ($edition -eq 'commercial-candidate') {
            $instructions += 'Owner may choose OFFLINE Ed25519 manifest signature instead of Authenticode.'
            $instructions += 'First verify candidate hash/key, real Ads acceptance and owner approval.'
            $instructions += 'Then package as COMMERCIAL-UNSIGNED with tools/package_unsigned_release.py.'
            $instructions += 'This unsigned candidate is NOT YET approved for customer distribution.'
          } else {
            $instructions += 'PILOT only: do not rebrand or distribute as paid Commercial.'
          }
          Set-Content -Path 'dist/README-VERIFY-BEFORE-SALE.txt' -Value $instructions -Encoding ascii
      - name: Bundle customer quick-start next to Windows EXE
        if: success()
        shell: pwsh
        run: |
          Copy-Item 'static/huong-dan-ket-noi.html' 'dist/HUONG-DAN-KET-NOI.html'
          Copy-Item 'static/customer-help-print.css' 'dist/customer-help-print.css'
          if (-not (Test-Path 'dist/HUONG-DAN-KET-NOI.html')) { throw 'Missing customer guide' }
      - name: Upload tested EXE and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.commercial) && 'LHM-Ads-AI-COMMERCIAL-CANDIDATE-UNSIGNED' || (matrix.builder == 'nuitka' && 'LHM-Ads-AI-PILOT-NUITKA' || 'LHM-Ads-AI-PILOT') }}
          path: |
            dist/LHM-Ads-AI.exe
            dist/LHM-Ads-AI.sha256
            dist/release-manifest.json
            dist/README-VERIFY-BEFORE-SALE.txt
            dist/HUONG-DAN-KET-NOI.html
            dist/customer-help-print.css
          if-no-files-found: error
          retention-days: 14
