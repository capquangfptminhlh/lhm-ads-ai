name: Build and test Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'ads_core/**'
      - 'static/**'
      - 'windows/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'tools/prepare_commercial_build.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
    inputs:
      commercial:
        description: 'Release signed-license commercial edition (requires vendor PUBLIC key secret)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller pillow pywebview==5.4
      - name: Run Python tests on Windows
        shell: pwsh
        run: python -m pytest -q
      - name: Check provider wizard JavaScript
        shell: pwsh
        run: node --check static/provider-studio.js
      - name: Pin vendor public key for manual COMMERCIAL build only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commercial }}
        shell: pwsh
        env:
          LHM_COMMERCIAL_PUBLIC_KEY_B64: ${{ secrets.LHM_COMMERCIAL_PUBLIC_KEY_B64 }}
        run: |
          python tools/prepare_commercial_build.py --commercial
          if ($LASTEXITCODE -ne 0) { throw 'Commercial key provisioning failed, EXE must not be shipped' }
      - name: Make branded Windows icon
        shell: pwsh
        run: python windows/make_icon.py
      - name: Build EXE with NO console window
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LHM-Ads-AI --icon windows/lhm-ads-ai.ico --paths . --add-data "static;static" --collect-submodules uvicorn --collect-submodules ads_core --collect-all cryptography --collect-all webview --collect-all clr_loader --collect-all pythonnet --hidden-import clr --collect-submodules windows windows/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/LHM-Ads-AI.exe)) { throw 'EXE not generated' }
      - name: Launch actual Windows EXE and check onboarding
        shell: pwsh
        run: ./windows/smoke-test.ps1
      - name: Validate native WebView2 desktop dependencies
        shell: pwsh
        run: python -c "import webview, clr; print('WebView2 bridge dependencies available')"
      - name: Smoke-test the real native window (WebView2)
        shell: pwsh
        run: |
          $env:LHM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'lhm-ads-native-gui-smoke'
          $proc = Start-Process -FilePath (Join-Path $PWD 'dist\LHM-Ads-AI.exe') -ArgumentList @('--window-smoke','--port','18766') -PassThru
          try {
            if (-not $proc.WaitForExit(60000)) { throw 'Native desktop window did not exit on time' }
            if ($proc.ExitCode -ne 0) { throw "Native window failed, exit code $($proc.ExitCode)" }
            Write-Host 'PASS: standalone Windows WebView2 window starts and closes'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            $log = Join-Path $env:LHM_DATA_DIR 'logs\startup.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
          }
      - name: Emit SHA256 checksum for customer verification
        if: success()
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/LHM-Ads-AI.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content 'dist/LHM-Ads-AI.sha256' -Value "$hash  LHM-Ads-AI.exe" -Encoding ascii
          Write-Host "LHM Ads AI SHA256: $hash"
      - name: Upload tested EXE and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.commercial) && 'LHM-Ads-AI-COMMERCIAL' || 'LHM-Ads-AI-PILOT' }}
          path: |
            dist/LHM-Ads-AI.exe
            dist/LHM-Ads-AI.sha256
          if-no-files-found: error
          retention-days: 14
