name: Deploy LHM Ads Commerce (manual, guarded)
on:
  workflow_dispatch:
    inputs:
      create_missing_d1:
        description: "Explicitly create lhm-ads-commerce D1 if missing"
        type: boolean
        required: true
        default: false
      create_access_app:
        description: "Explicitly create LHM Admin Cloudflare Access application if missing"
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: lhm-ads-commerce-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Validate Cloudflare Access, D1, migrations, Worker and HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LHM_ADMIN_EMAIL: ${{ secrets.LHM_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse deployment without scoped Cloudflare and Admin credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$LHM_ADMIN_EMAIL" || (echo "Missing LHM_ADMIN_EMAIL secret" && exit 1)
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Validate code and database contract before deployment
        run: |
          python -m py_compile tools/deploy_commerce.py tools/bootstrap_access.py tools/build_github_pages.py
          node --check workers/ads-api/src/index.js
          node --check workers/ads-api/src/admin.js
          python -m unittest discover -s tests -p 'test_bootstrap_cloudflare.py' -v
          python -m unittest discover -s tests -p 'test_admin_d1_sql.py' -v
          node --test tests/worker_commerce_smoke.test.mjs
      - name: Create missing D1 only with explicit approval
        if: ${{ inputs.create_missing_d1 }}
        run: python tools/deploy_commerce.py --provision-only --create-db
      - name: Verify existing commerce D1
        run: python tools/deploy_commerce.py --dry-run
      - name: Persist verified non-secret D1 binding in source configuration
        run: |
          python tools/persist_commerce_binding.py
          if ! git diff --quiet -- wrangler.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "chore(cloudflare): persist verified COMMERCE_DB binding"
            git push origin HEAD:main
          fi
      - name: Create missing Access app only with explicit approval
        if: ${{ inputs.create_access_app }}
        run: python tools/bootstrap_access.py --create-app
      - name: Validate existing Access app
        if: ${{ !inputs.create_access_app }}
        run: python tools/bootstrap_access.py
      - name: Apply migrations and deploy Worker with the REAL D1 binding
        run: python tools/deploy_commerce.py
      - name: Install verified Access audience, issuer and Admin email as Worker secrets
        run: python tools/bootstrap_access.py --apply-worker-secrets
      - name: Validate live public routes, protected Admin and database readiness
        run: python tools/smoke_production.py --strict
