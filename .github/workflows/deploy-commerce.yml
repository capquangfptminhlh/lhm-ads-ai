name: Deploy LHM Ads Commerce (manual, guarded)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lhm-ads-commerce-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Validate D1, migrate, deploy, smoke production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Cloudflare deployment credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
      - name: Install Wrangler and verify syntax
        run: |
          npm install --no-save --no-package-lock wrangler@4
          python -m py_compile tools/deploy_commerce.py tools/build_github_pages.py
          node --check workers/ads-api/src/index.js
          node --check workers/ads-api/src/admin.js
      - name: Verify existing D1 (do not create an unknown database)
        run: python tools/deploy_commerce.py --dry-run
      - name: Run database migrations and deploy Worker
        run: python tools/deploy_commerce.py
      - name: Check production endpoint and enforced Access gate
        run: python tools/smoke_production.py --strict
