name: Deploy static PWA preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'tools/build_github_pages.py'
      - '.github/workflows/github-pages-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-pwa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build safe static PWA
        run: python tools/build_github_pages.py --output _site
      - name: Check static asset and PWA rules
        run: python -m unittest discover -s tests -p 'test_github_pages_build_unittest.py' -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
