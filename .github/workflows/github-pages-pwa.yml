name: Validate Cloudflare PWA static bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pwa-static-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source syntax checks
        run: |
          python -m py_compile tools/build_github_pages.py tools/deploy_commerce.py tools/bootstrap_access.py tools/persist_commerce_binding.py
          node --check workers/ads-api/src/admin.js
          node --check workers/ads-api/src/index.js
          node --check workers/ads-api/src/customer-auth.js
          node --check static/customer-login.js
          node --check static/device-studio.js
          node --check static/sw.js
          python tools/check_admin_script.py
      - name: Worker request and authorization smoke tests
        run: node --test tests/worker_commerce_smoke.test.mjs tests/customer_auth_smoke.test.mjs
      - name: Guarded Cloudflare bootstrap regression tests
        run: python -m unittest discover -s tests -p 'test_bootstrap_cloudflare.py' -v
      - name: Subscription D1 regression tests
        run: python -m unittest discover -s tests -p 'test_admin_d1_sql.py' -v
      - name: Build fail-closed PWA assets
        run: python tools/build_github_pages.py --output _site
      - name: Verify actual Wrangler Worker and assets bundle (offline dry-run)
        # A green PWA/static test alone does not prove Workers Builds can bundle
        # the Worker + D1 binding + generated _site/ assets for deployment.
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy --dry-run --outdir .worker-dry-run
      - name: Verify bundle contains no backend secrets
        run: python -m unittest discover -s tests -p 'test_github_pages_build_unittest.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudflare-PWA-Static-Bundle
          path: _site/
          retention-days: 7
# Production deployment is through Cloudflare Workers Builds connected to GitHub.
# GitHub Pages is intentionally NOT used to sell/serve a commercial SaaS.
