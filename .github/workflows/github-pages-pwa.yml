name: Validate Cloudflare PWA static bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pwa-static-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source syntax checks
        run: |
          python -m py_compile tools/build_github_pages.py tools/deploy_commerce.py
          node --check workers/ads-api/src/admin.js
          node --check workers/ads-api/src/index.js
          node --check static/device-studio.js
          node --check static/sw.js
          python tools/check_admin_script.py
      - name: Worker request and authorization smoke tests
        run: node --test tests/worker_commerce_smoke.test.mjs
      - name: Subscription D1 regression tests
        run: python -m unittest discover -s tests -p 'test_admin_d1_sql.py' -v
      - name: Build fail-closed PWA assets
        run: python tools/build_github_pages.py --output _site
      - name: Verify bundle contains no backend secrets
        run: python -m unittest discover -s tests -p 'test_github_pages_build_unittest.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudflare-PWA-Static-Bundle
          path: _site/
          retention-days: 7
# Production deployment is through Cloudflare Workers Builds connected to GitHub.
# GitHub Pages is intentionally NOT used to sell/serve a commercial SaaS.
