name: Test LHM Ads AI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --check static/studio.js
      - run: node --check static/sw.js
      - run: node --check static/pwa-install.js
      - run: node --check static/pwa-offline.js
      - run: node --check static/budget-push.js
      - run: node --check static/cloudflare-hosting-gate.js
      - run: node --check workers/ads-api/src/index.js
      - run: python -m unittest discover -s tests -p 'test_github_pages_build_unittest.py' -v
      - run: node --check static/provider-studio.js
      - run: node --check static/finpoint-accounts-ai.js
      - run: node --check static/finpoint-motion.js
      - run: node --check static/command-palette.js
      - run: node --check static/update-ui.js
      - run: node --check static/connection-guide.js
      - run: node --check static/oauth-finished.js
      - run: node --check static/customer-help.js
      - run: node --check static/openrouter-diagnostics.js
      - run: node --check static/report-date-ranges.js
      - run: node --check static/goal-settings.js
      - run: node --check static/workspace-pages.js
      - run: node --check static/commercial.js
      - name: Install Playwright browser for UI smoke test
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 playwright && python -m playwright install --with-deps chromium; then
              echo "Playwright ready"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright setup failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done
      - name: Test provider selection with real Chromium and capture screenshots
        run: python tools/ui-smoke.py
      - name: Test actual first-run setup on desktop/mobile and redirect to Studio
        run: python tools/setup_ui_smoke.py
      - name: Upload UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-AI-UI-Screenshots
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
          retention-days: 14
