name: Test LHM Ads AI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --check static/studio.js
      - run: node --check static/provider-studio.js
      - name: Install Playwright browser for UI smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test provider selection with real Chromium and capture screenshots
        run: python tools/ui-smoke.py
      - name: Upload UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-AI-UI-Screenshots
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
          retention-days: 14
