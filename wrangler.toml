# Production Cloudflare Worker + Static Assets for ads.lhmcrm.com.
# Cloudflare Custom Domain uses the existing lhmcrm.com zone; the apex CRM remains untouched.
name = "lhm-ads-cloudflare-api"
main = "workers/ads-api/src/index.js"
compatibility_date = "2026-10-24"
workers_dev = false
# Preserve Admin Access variables configured through Cloudflare Dashboard.
keep_vars = true

[[routes]]
pattern = "ads.lhmcrm.com"
custom_domain = true

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "COMMERCE_DB"
database_name = "lhm-ads-commerce"
database_id = "6f706d72-e94a-47d7-83e4-86c112c122b6"
migrations_dir = "migrations"

# Daily cleanup of expired orders, sessions and seats (workers/ads-api/src/index.js).
[triggers]
crons = ["17 20 * * *"]
