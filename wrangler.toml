# Single production Cloudflare Worker + Static Assets. No GitHub Pages hosting.
name = "lhm-ads-cloudflare-api"
main = "workers/ads-api/src/index.js"
compatibility_date = "2026-10-24"
workers_dev = false

[[routes]]
pattern = "ads.lhm.com"
custom_domain = true

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
